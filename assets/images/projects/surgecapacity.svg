<text x="534" y="240" fill="#FF6B6B">P95 FLAT 4.42H</text>
<text x="534" y="274">P95 SHAPED 2.05H</text>
<text x="534" y="308">1,512 CLINICIAN-HOURS</text>
</g>

<text x="32" y="338" font-size="9" fill-opacity="0.7">ROSTER 168 H/WEEK · LWBS AFTER 6 H · FIXED SEED REPRODUCIBLE</text>
</svg>