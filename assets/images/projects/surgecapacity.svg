<line x1="182" y1="176" x2="234" y2="176" marker-end="url(#aw)"/>
<line x1="321" y1="250" x2="321" y2="204" marker-end="url(#aw)"/>
<line x1="321" y1="122" x2="321" y2="148" stroke-dasharray="4 3" marker-end="url(#aw)"/>
</g>
<line x1="406" y1="176" x2="458" y2="176" stroke="#FF6B6B" stroke-width="1" marker-end="url(#ar)"/>
<line x1="534" y1="202" x2="534" y2="220" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1"/>

<text x="460" y="96" font-size="9" fill="#FF6B6B">TAIL, NOT MEAN</text>
<text x="460" y="112" font-size="9" fill-opacity="0.7">STAFF TO THE P95</text>

