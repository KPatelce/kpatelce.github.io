<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
<title>PN-05 tailsample: tail-based trace sampler blueprint</title>
<desc>Blueprint of OTLP ingest, bounded queues, sampler core with trace buffer, policy engine and decision cache, and export path to a downstream OTLP endpoint.</desc>
<defs>
<pattern id="m" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#fff" stroke-opacity="0.05"/></pattern>
<pattern id="M" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#fff" stroke-opacity="0.09"/></pattern>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#fff" fill-opacity="0.7"/></marker>
<marker id="k" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#FF6B6B"/></marker>
</defs>
<style>
text{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;font-size:9px;letter-spacing:.06em;fill:#fff;text-transform:uppercase}
.t{font-size:10px}
.s{fill-opacity:.7}
.c{text-anchor:middle}
.big{font-size:28px;fill:#FF6B6B}
.n{font-size:18px;fill:#FF6B6B}
.b{fill:#0a0e27;stroke:#fff;stroke-opacity:.6;stroke-width:1}
.k{fill:#0a0e27;stroke:#FF6B6B;stroke-width:1}
.w{fill:none;stroke:#fff;stroke-opacity:.7;stroke-width:1}
.r{fill:none;stroke:#FF6B6B;stroke-width:1}
</style>
<rect width="640" height="360" fill="#0a0e27"/>
<rect width="640" height="360" fill="url(#m)"/>
<rect width="640" height="360" fill="url(#M)"/>

<rect class="b" x="16" y="16" width="608" height="24"/>
<text class="t" x="28" y="32">PN-05 · TAILSAMPLE · TAIL-BASED TRACE SAMPLER</text>

<rect class="b" x="16" y="68" width="100" height="36"/>
<text class="c" x="66" y="90">OTLP clients</text>
<rect class="b" x="146" y="68" width="92" height="36"/>
<text class="c" x="192" y="84">in-flight</text>
<text class="c" x="192" y="96">limit</text>
<rect class="b" x="268" y="68" width="92" height="36"/>
<text class="c" x="314" y="90">receivers</text>
<rect class="b" x="390" y="68" width="92" height="36"/>
<text class="c" x="436" y="84">ingest</text>
<text class="c" x="436" y="96">queue</text>

<line class="w" x1="116" y1="86" x2="146" y2="86" marker-end="url(#a)"/>
<line class="w" x1="238" y1="86" x2="268" y2="86" marker-end="url(#a)"/>
<line class="w" x1="360" y1="86" x2="390" y2="86" marker-end="url(#a)"/>
<line class="r" x1="436" y1="104" x2="436" y2="140" marker-end="url(#k)"/>

<rect class="w" x="16" y="140" width="466" height="110"/>
<text class="s" x="28" y="156">sampler task · deterministic core</text>

<rect class="b" x="32" y="168" width="116" height="64"/>
<text class="c" x="90" y="196">trace buffer</text>
<text class="c s" x="90" y="210">deadline FIFO</text>
<rect class="b" x="174" y="168" width="116" height="64"/>
<text class="c" x="232" y="196">policy engine</text>
<text class="c s" x="232" y="210">9 kinds</text>
<rect class="b" x="316" y="168" width="116" height="64"/>
<text class="c" x="374" y="196">decision</text>
<text class="c" x="374" y="210">cache</text>

<line class="r" x1="148" y1="200" x2="174" y2="200" marker-end="url(#k)"/>
<line class="r" x1="290" y1="200" x2="316" y2="200" marker-end="url(#k)"/>
<text class="c s" x="374" y="246">late spans</text>

<line class="r" x1="74" y1="250" x2="74" y2="284" marker-end="url(#k)"/>

<rect class="b" x="16" y="284" width="116" height="36"/>
<text class="c" x="74" y="306">export queue</text>
<rect class="b" x="180" y="284" width="116" height="36"/>
<text class="c" x="238" y="306">export worker</text>
<rect class="b" x="344" y="284" width="116" height="36"/>
<text class="c" x="402" y="306">downstream OTLP</text>

<line class="r" x1="132" y1="302" x2="180" y2="302" marker-end="url(#k)"/>
<line class="r" x1="296" y1="302" x2="344" y2="302" marker-end="url(#k)"/>

<rect class="k" x="500" y="68" width="124" height="68"/>
<text class="big" x="512" y="112">9</text>
<text class="s" x="512" y="128">policy kinds</text>

<rect class="k" x="500" y="152" width="124" height="68"/>
<text class="n" x="512" y="194">429/503</text>
<text class="s" x="512" y="212">backpressure</text>

<rect class="b" x="500" y="236" width="124" height="36"/>
<text class="s" x="512" y="258">gRPC UNAVAILABLE</text>

<text class="s" x="28" y="340">core runs on logical clock: no sockets, locks or wall time</text>
</svg>