<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
<title>PN-02 previewd: PR-scoped preview environment controller schematic</title>
<desc>Blueprint schematic: GitHub pull_request webhook feeds a webhook receiver, intake and PreviewEnvironment spec into the kube-apiserver. The reconciler uses a pure lifecycle state machine, a renderer, an SCM reporter and an orphan collector. Readouts: 11 objects per namespace, 72h default TTL, 1 namespace per PR.</desc>
<defs>
