.t{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;font-size:9px;letter-spacing:0.06em;fill:#ffffff}
.h{font-size:10px}
.n{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;font-size:11px;letter-spacing:0.06em;fill:#FF6B6B}
.s{fill-opacity:0.7}
.b{fill:#0a0e27;stroke:#ffffff;stroke-opacity:0.6;stroke-width:1}
.w{fill:none;stroke:#ffffff;stroke-opacity:0.6;stroke-width:1}
</style>
<pattern id="g" width="16" height="16" patternUnits="userSpaceOnUse">
<path d="M16 0H0V16" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
</pattern>
<pattern id="m" width="80" height="80" patternUnits="userSpaceOnUse">
<path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1"/>
</pattern>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0 0L8 4L0 8z" fill="#ffffff" fill-opacity="0.8"/>
</marker>
<marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0 0L8 4L0 8z" fill="#FF6B6B"/>
</marker>
</defs>

