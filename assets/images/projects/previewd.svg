<rect x="0" y="0" width="640" height="360" fill="url(#m)"/>

<rect x="16" y="16" width="608" height="24" class="w"/>
<text class="t h" x="28" y="32">PN-02 · PREVIEWD · PR-SCOPED PREVIEW ENVIRONMENT CONTROLLER</text>

<rect x="168" y="56" width="300" height="216" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="4 3"/>
<text class="t s" x="178" y="70">PREVIEWD</text>

<rect x="16" y="216" width="120" height="52" class="b"/>
<text class="t h" x="76" y="238" text-anchor="middle">GITHUB</text>
<text class="t s" x="76" y="252" text-anchor="middle">PULL_REQUEST</text>

