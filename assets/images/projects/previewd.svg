<text class="t" x="240" y="97" text-anchor="middle">WEBHOOK RECEIVER</text>
<text class="t s" x="240" y="111" text-anchor="middle">HMAC · DEDUPE</text>

<rect x="184" y="140" width="112" height="40" class="b"/>
<text class="t h" x="240" y="157" text-anchor="middle">INTAKE</text>
<text class="t s" x="240" y="171" text-anchor="middle">UPSERT SPEC</text>

