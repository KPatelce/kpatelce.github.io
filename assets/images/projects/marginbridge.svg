<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <title>PN-08 marginbridge schematic</title>
  <desc>Blueprint schematic: synthetic transaction generator feeds the bridge, elasticity and discount-by-region modules, which feed the demo report. Tests score elasticity against ground truth.</desc>
  <defs>
    <pattern id="minor" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0 H0 V16" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="major" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#ffffff" fill-opacity="0.7"/>
    </marker>
    <marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#FF6B6B"/>
    </marker>
  </defs>
  <style>
    text { font-family: "IBM Plex Mono", SFMono-Regular, Consolas, monospace; letter-spacing: 0.6px; text-transform: uppercase; fill: #ffffff; }
    .s { font-size: 9px; fill-opacity: 0.7; }
    .l { font-size: 10px; }
    .k { fill: #FF6B6B; }
  </style>

  <rect x="0" y="0" width="640" height="360" fill="#0a0e27"/>
  <rect x="0" y="0" width="640" height="360" fill="url(#minor)"/>
  <rect x="0" y="0" width="640" height="360" fill="url(#major)"/>

  <rect x="16" y="16" width="608" height="26" fill="none" stroke="#ffffff" stroke-opacity="0.6"/>
  <text x="28" y="33" class="l">PN-08 · MARGINBRIDGE · SYNTHETIC PRICE-VOLUME-MIX &amp; ELASTICITY</text>

  <rect x="36" y="60" width="130" height="36" fill="none" stroke="#FF6B6B" stroke-opacity="0.8"/>
  <text x="101" y="76" font-size="11" text-anchor="middle" class="k">21.4% → 20.8%</text>
  <text x="101" y="89" font-size="8" text-anchor="middle" class="s">margin rate</text>

  <rect x="36" y="110" width="130" height="44" fill="none" stroke="#ffffff" stroke-opacity="0.6"/>
  <text x="101" y="128" font-size="10" text-anchor="middle">GENERATOR</text>
  <text x="101" y="144" font-size="9" text-anchor="middle" class="s">known true ε</text>

  <rect x="36" y="236" width="130" height="36" fill="none" stroke="#FF6B6B" stroke-opacity="0.8"/>
  <text x="101" y="252" font-size="11" text-anchor="middle" class="k">6,231</text>
  <text x="101" y="265" font-size="8" text-anchor="middle" class="s">transaction lines</text>

  <rect x="200" y="110" width="100" height="44" fill="none" stroke="#ffffff" stroke-opacity="0.6"/>
  <text x="250" y="128" font-size="10" text-anchor="middle">TXN LIST</text>
  <text x="250" y="144" font-size="9" text-anchor="middle" class="s">2 years</text>

  <rect x="330" y="60" width="140" height="44" fill="none" stroke="#ffffff" stroke-opacity="0.6"/>
  <text x="400" y="78" font-size="10" text-anchor="middle">BRIDGE</text>
  <text x="400" y="94" font-size="9" text-anchor="middle" class="s">price · volume · mix</text>

  <rect x="330" y="110" width="140" height="44" fill="none" stroke="#FF6B6B" stroke-opacity="0.8"/>
  <text x="400" y="128" font-size="10" text-anchor="middle" class="k">ELASTICITY</text>
  <text x="400" y="144" font-size="9" text-anchor="middle" class="s">naive vs corrected OLS</text>

  <rect x="330" y="180" width="140" height="44" fill="none" stroke="#ffffff" stroke-opacity="0.6"/>
  <text x="400" y="198" font-size="10" text-anchor="middle">DISCOUNT</text>
  <text x="400" y="214" font-size="9" text-anchor="middle" class="s">by region, mix-adj.</text>

  <rect x="512" y="110" width="112" height="44" fill="none" stroke="#ffffff" stroke-opacity="0.6"/>
  <text x="568" y="128" font-size="10" text-anchor="middle">DEMO REPORT</text>
  <text x="568" y="144" font-size="9" text-anchor="middle" class="s">tables + CI</text>

  <rect x="512" y="240" width="112" height="44" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-dasharray="4 3"/>
  <text x="568" y="258" font-size="10" text-anchor="middle">TESTS</text>
  <text x="568" y="274" font-size="9" text-anchor="middle" class="s">score vs truth</text>

  <rect x="200" y="260" width="280" height="36" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-dasharray="2 3"/>
  <text x="340" y="276" font-size="9" text-anchor="middle" class="s">exact reconciliation</text>
  <text x="340" y="289" font-size="9" text-anchor="middle" class="s">residue → unexplained</text>

  <g fill="none" stroke-width="1">
    <path d="M166 132 H200" stroke="#FF6B6B" marker-end="url(#r)"/>
    <path d="M300 132 H330" stroke="#FF6B6B" marker-end="url(#r)"/>
    <path d="M300 132 H315 V82 H330" stroke="#ffffff" stroke-opacity="0.7" marker-end="url(#a)"/>
    <path d="M315 132 V202 H330" stroke="#ffffff" stroke-opacity="0.7" marker-end="url(#a)"/>
    <path d="M470 82 H491 V202 H470" stroke="#ffffff" stroke-opacity="0.6"/>
    <path d="M470 132 H491" stroke="#FF6B6B"/>
    <path d="M491 132 H512" stroke="#FF6B6B" marker-end="url(#r)"/>
    <path d="M568 240 V156" stroke="#ffffff" stroke-opacity="0.6" stroke-dasharray="4 3" marker-end="url(#a)"/>
  </g>

  <text x="36" y="332" font-size="8" class="s">red = key path · dashed = ground-truth scoring</text>
</svg>